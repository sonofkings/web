<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout — Son of Kings</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:Jost;src:url('/assets/fonts/jost-regular.woff2')}@font-face{font-family:Cinzel;src:url('/assets/fonts/cinzel-regular.woff2')}
*{box-sizing:border-box}body{margin:0;background:#090909;color:#f6f2e8;font-family:Jost,Arial,sans-serif;min-height:100vh}.top{height:72px;border-bottom:1px solid #27231b;display:flex;align-items:center;justify-content:center;position:relative}.back{position:absolute;left:24px;color:#d8c79c;text-decoration:none}.brand{font-family:Cinzel,serif;letter-spacing:.18em;font-size:18px}.wrap{max-width:920px;margin:0 auto;padding:56px 24px 80px;display:grid;grid-template-columns:1.1fr .9fr;gap:64px}.eyebrow{color:#b69a5b;letter-spacing:.16em;font-size:12px;text-transform:uppercase}.title{font-family:Cinzel,serif;font-size:42px;font-weight:400;margin:8px 0 12px}.muted{color:#a9a49a}.card{border:1px solid #2c2923;background:#11100e;padding:24px}.item{display:flex;gap:18px;padding:18px 0;border-bottom:1px solid #29261f}.item img{width:82px;height:98px;object-fit:cover;background:#171717}.item h3{margin:4px 0;font-family:Cinzel,serif;font-weight:400;font-size:16px}.total{display:flex;justify-content:space-between;font-size:22px;padding-top:22px}.btn{width:100%;margin-top:22px;padding:17px;border:0;background:#e7d4a0;color:#0b0a08;font:600 15px Jost;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.secure{text-align:center;color:#8d887e;font-size:12px;margin-top:13px}.empty{text-align:center;padding:60px 20px}.error{color:#e4a6a6;margin-top:14px;display:none}@media(max-width:720px){.wrap{grid-template-columns:1fr;gap:30px;padding-top:34px}.title{font-size:34px}.back{left:14px;font-size:13px}}
</style>
</head>
<body><header class="top"><a class="back" href="/">← Shop</a><div class="brand">SON OF KINGS</div></header>
<main class="wrap"><section><div class="eyebrow">Secure checkout</div><h1 class="title">Your order</h1><p class="muted">Review your selected sizes and quantities. Payment and U.S. shipping details are securely collected by Stripe.</p><div id="items"></div></section>
<aside><div class="card"><div class="eyebrow">Order summary</div><div class="total"><span>Total</span><strong id="total">$0.00</strong></div><button id="pay" class="btn">Continue to secure payment</button><div id="error" class="error">Checkout could not be started. Please try again.</div><div class="secure">Secure payment powered by Stripe</div></div></aside></main>
<script>
(function(){var KEY='sok.bag.v2',PRICE=199.99,bag={};try{bag=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}var entries=Object.keys(bag).filter(function(k){return /^Black\|(S|M|L|XL|XXL)$/.test(k)&&bag[k]>0});var items=document.getElementById('items'),pay=document.getElementById('pay');if(!entries.length){items.innerHTML='<div class="card empty">Your bag is empty.<br><br><a href="/" style="color:#d8c79c">Return to the shop</a></div>';pay.disabled=true;return}var total=0;entries.forEach(function(k){var p=k.split('|'),q=Math.min(9,Math.max(1,parseInt(bag[k],10)||1));total+=q*PRICE;var el=document.createElement('div');el.className='item';el.innerHTML='<img src="/assets/img/black-hoodie.webp" alt=""><div><div class="eyebrow">Black edition</div><h3>Crest Tracksuit</h3><div class="muted">Size '+p[1]+' · Qty '+q+' · $'+(q*PRICE).toFixed(2)+'</div></div>';items.appendChild(el)});document.getElementById('total').textContent='$'+total.toFixed(2);pay.onclick=async function(){pay.disabled=true;pay.textContent='Opening Stripe…';document.getElementById('error').style.display='none';try{var cart=entries.map(function(k){var p=k.split('|');return {color:p[0],size:p[1],quantity:Math.min(9,Math.max(1,parseInt(bag[k],10)||1))}});var r=await fetch('/api/checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({items:cart})});var d=await r.json();if(!r.ok||!d.url)throw new Error();location.href=d.url}catch(e){pay.disabled=false;pay.textContent='Continue to secure payment';document.getElementById('error').style.display='block'}}})();
</script></body></html>
